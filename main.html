<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для самой прекрасной!</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root {
    --text-color: #111;
    --card-bg: rgba(255,255,255,0.85);
}

body.dark {
    --text-color: #fff;
    --card-bg: rgba(0,0,0,0.6);
}

body {
    margin: 0;
    font-family: 'Inter', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: background 0.8s ease;
    color: var(--text-color);
}

.container {
    text-align: center;
    max-width: 700px;
    padding: 40px;
}

.card {
    position: relative;
    background: var(--card-bg);
    backdrop-filter: blur(10px);
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.5s ease, transform 0.5s ease;
}

.decor-quote {
    position: absolute;
    font-size: 80px;
    color: rgba(0,0,0,0.05);
    top: 10px;
    left: 20px;
    pointer-events: none;
}

.quote {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    line-height: 1.6;
    margin-bottom: 15px;
    position: relative;
    z-index: 1;
}

.author {
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    opacity: 0.7;
    margin-bottom: 25px;
    position: relative;
    z-index: 1;
}

.buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
}

button {
    padding: 10px 18px;
    border-radius: 20px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    background: #111;
    color: white;
    transition: 0.3s ease;
}

button:hover {
    opacity: 0.8;
}

body.dark button {
    background: white;
    color: black;
}

#favButton.active {
    background: gold;
    color: black;
}

.favorites-count {
    margin-top: 15px;
    font-size: 13px;
    opacity: 0.6;
}

.modal {
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(3px);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transform: scale(0.95);
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
}

.modal.show {
    opacity: 1;
    transform: scale(1);
    pointer-events: all;
}

.modal-content {
    background: var(--card-bg);
    padding: 20px 30px;
    border-radius: 15px;
    max-width: 400px;
    width: 90%;
    transition: transform 0.4s ease;
}

.close {
    float: right;
    font-size: 20px;
    cursor: pointer;
}

footer {
    margin-top: 25px;
    font-size: 12px;
    opacity: 0.6;
}

</style>
</head>

<body>

<div class="container">
    <div class="card">
        <div class="decor-quote">“</div>
        <div id="quote" class="quote"></div>
        <div id="author" class="author"></div>

        <div class="buttons">
            <button onclick="newQuote()">Новая цитата</button>
            <button onclick="copyQuote()">Скопировать</button>
            <button id="favButton" onclick="toggleFavorite()">⭐ В избранное</button>
            <button onclick="showFavorites()">📂 Показать избранное</button>
            <button onclick="toggleTheme()">Тема</button>
        </div>

        <div class="favorites-count">
            Сохранено: <span id="favCount">0</span>
        </div>
    </div>

    <footer>
        Сайт для хорошего настроения!
    </footer>
</div>

<div id="favModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeFavorites()">&times;</span>
        <h3>Избранное</h3>
        <ul id="favList"></ul>
    </div>
</div>
<script>
    const quotes = [
        { text:"Твоя сила в том, что ты продолжаешь идти вперед.", author:"Твое сердце ♡"},
        { text:"Не бойся быть собой — это твоя суперсила.", author:"Твое сердце ♡"},
        { text:"Сегодня твой день — начни его с улыбки!", author:"Твое сердце ♡"},
        { text:"Когда веришь в себя, весь мир подстраивается.", author:"Твое сердце ♡"},
        { text:"Ты достойна всего, о чем мечтаешь.", author:"Твое сердце ♡"},
        { text:"Вдохновляй себя — и ты вдохновишь других.", author:"Твое сердце ♡"},
        { text:"Улыбайся — ты светишься изнутри.", author:"Твое сердце ♡"},
        { text:"Настоящая красота — это уверенность.", author:"Твое сердце ♡"},
        { text:"Доверяй своему сердцу и интуиции.", author:"Твое сердце ♡"},
        { text:"Твоя решимость определяет твою силу. Никогда не сомневайся в себе", author:"Твое сердце ♡"},
        { text:"Будь смелой и бросай вызов своим границам. Только так ты раскроешь свой истинный потенциал", author:"Твое сердце ♡"},
        { text:"Верь в себя и свои возможности – ты способна на великие дела!", author:"Твое сердце ♡"},
        { text:"Твоя настойчивость и умение преодолевать препятствия приведут к триумфу", author:"Твое сердце ♡"},
        { text:"Сегодня новый день, полный возможностей. Будь смелой и иди навстречу своим мечтам!", author:"Твое сердце ♡"},
        { text:"Позволь солнцу войти в твою душу и зарядить тебя позитивом. Ты готова сделать этот день незабываемым!", author:"Твое сердце ♡"},
        { text:"Твоя энергия и решимость – ключи к успеху. Приветствуй утро с улыбкой и иди встречать свои цели!", author:"Твое сердце ♡"},
        { text:"Твоя улыбка – секрет успешного дня. Улыбнись зеркалу и миру!", author:"Твое сердце ♡"},
        { text:"Не забывай, какая сильная и талантливая ты. Ты можешь справиться с чем угодно!", author:"Твое сердце ♡"},
        { text:"Самое важное — не падать духом, даже если обстоятельства против тебя.", author:"Джек Лондон, «Мартин Иден»"},
        { text:"Главное — не сдаваться. Победа любит терпение.", author:"Виктор Гюго, «Отверженные»"},
        { text:"Нет ничего более сильного, чем человек, решивший встать после падения.", author:"Фёдор Достоевский, «Идиот»"},
        { text:"Там, где трудно, — там и начинается настоящее.", author:"Эрнест Хемингуэй, «Старик и море»"},
        { text:"Не позволяй никому решать за тебя, каким должен быть твой путь.", author:"Рэй Брэдбери, «Вино из одуванчиков»"},
        { text:"Даже в самые тёмные времена можно найти свет — если не бояться его искать.", author:"Джоан Роулинг, «Гарри Поттер и узник Азкабана»"},
        { text:"Самая длинная ночь заканчивается рассветом.", author:"Джон Рональд Руэл Толкин, «Властелин колец»"},
        { text:"Самая большая мудрость — научиться быть счастливым прямо сейчас.", author:"Лев Толстой"},
        { text:"Коли ты хочешь, чтобы тебя уважали, во-первых и главное — уважай сам себя.", author:"Федор Достоевский, «Униженные и оскорбленные»"},
        { text:"Чтобы жить честно, надо рваться, путаться, ошибаться, начинать и опять бросать, и опять начинать, и опять бросать, и вечно бороться.", author:"Лев Толстой, Письмо тетке А.А. Толстой"},
        { text:"Никогда и ничего не просите! Никогда и ничего, и в особенности у тех, кто сильнее вас. Сами предложат и сами все дадут!", author:"Михаил Булгаков, «Мастер и Маргарита»"},
        { text:"Хорошее воспитание не в том, что ты не прольешь соуса на скатерть, а в том, что ты не заметишь, если это сделает кто-нибудь другой.", author:"Антон Чехов, «Дом с мезонином»"},
        { text:"Если хочешь победить весь мир, победи себя.", author:"Федор Достоевский, «Бесы»"},
        { text:"Что бы ни говорили пессимисты, земля все же совершенно прекрасна, а под луною и просто неповторима.", author:"Михаил Булгаков, «Мастер и Маргарита»"},
        { text:"Мимолетность — вот что отчасти восхищает меня. Столько труда, любви, искусного мастерства вкладывается в удовольствие, которое длится всего-то мгновение и которое лишь немногие способны по-настоящему оценить.", author:"Джоанн Харрис, «Шоколад»"},
        { text:"Оставим мертвым хоронить мертвых, а пока жив, надо жить и быть счастливым.", author:"Лев Толстой, «Война и мир»"},
        { text:"Главное — верить. Если веришь, то все обязательно будет хорошо — даже лучше, чем ты сам можешь устроить.", author:"Марк Твен, «Приключения Тома Сойера»"},
        { text:"В человеке я люблю свет. Толщина свечи меня не волнует. Пламя скажет мне, хороша ли свеча.", author:"Антуан де Сент-Экзюпери, «Цитадель»"},
        { text:"Хорошее время не с неба падает, а мы его делаем, оно заключается в сердце нашем.", author:"Федор Достоевский, «Село Степанчиково и его обитатели»"},
        { text:"Ты живешь в своих поступках, а не в теле. Ты – это твои действия, и нет другого тебя.", author:"Антуан де Сент-Экзюпери, «Маленький принц»"}
    ];

const gradients = [
    "linear-gradient(135deg, #667eea, #764ba2)",
    "linear-gradient(135deg, #ff9a9e, #fad0c4)",
    "linear-gradient(135deg, #a18cd1, #fbc2eb)",
    "linear-gradient(135deg, #f6d365, #fda085)",
    "linear-gradient(135deg, #89f7fe, #66a6ff)"
];

const quoteEl = document.getElementById("quote");
const authorEl = document.getElementById("author");
const card = document.querySelector(".card");
const favCountEl = document.getElementById("favCount");
const favButton = document.getElementById("favButton");

let currentQuote = null;

function newQuote() {
    const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
    const randomGradient = gradients[Math.floor(Math.random() * gradients.length)];

    card.style.opacity = "0";
    card.style.transform = "translateY(20px)";

    setTimeout(() => {
        currentQuote = randomQuote;
        quoteEl.textContent = "“" + randomQuote.text + "”";
        authorEl.textContent = "— " + randomQuote.author;
        document.body.style.background = randomGradient;

        card.style.opacity = "1";
        card.style.transform = "translateY(0)";

        updateFavButton();
    }, 300);
}

function copyQuote() {
    if (!currentQuote) return;
    const text = quoteEl.textContent + " " + authorEl.textContent;
    navigator.clipboard.writeText(text);
}

function toggleTheme() {
    document.body.classList.toggle("dark");
    localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light");
}

function loadTheme() {
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
        document.body.classList.add("dark");
    }
}

function toggleFavorite() {
    if (!currentQuote) return;

    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
    const exists = favorites.some(q => q.text === currentQuote.text);

    if (!exists) {
        favorites.push(currentQuote);
    } else {
        favorites = favorites.filter(q => q.text !== currentQuote.text);
    }

    localStorage.setItem("favorites", JSON.stringify(favorites));
    updateFavoriteCount();
    updateFavButton();
}

function updateFavoriteCount() {
    const favorites = JSON.parse(localStorage.getItem("favorites")) || [];
    favCountEl.textContent = favorites.length;
}

function updateFavButton() {
    if (!currentQuote) return;
    const favorites = JSON.parse(localStorage.getItem("favorites")) || [];
    const exists = favorites.some(q => q.text === currentQuote.text);

    if (exists) {
        favButton.classList.add("active");
        favButton.textContent = "⭐ В избранном";
    } else {
        favButton.classList.remove("active");
        favButton.textContent = "⭐ В избранное";
    }
}

function showFavorites() {
    const favorites = JSON.parse(localStorage.getItem("favorites")) || [];
    const favList = document.getElementById("favList");
    favList.innerHTML = "";

    favorites.forEach((q, index) => {
        const li = document.createElement("li");
        li.textContent = `"${q.text}" — ${q.author}`;

        const del = document.createElement("button");
        del.textContent = "Удалить";
        del.style.marginLeft = "10px";
        del.onclick = () => removeFavorite(index);

        li.appendChild(del);
        favList.appendChild(li);
    });

    document.getElementById("favModal").classList.add("show");
}

function closeFavorites() {
    document.getElementById("favModal").classList.remove("show");
}

function removeFavorite(index) {
    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
    favorites.splice(index, 1);
    localStorage.setItem("favorites", JSON.stringify(favorites));
    updateFavoriteCount();
    showFavorites();
}

loadTheme();
newQuote();
updateFavoriteCount();
updateFavButton();
</script>

</body>
</html>
